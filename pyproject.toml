[project]
name = "agentic-social-honey-pot"
version = "0.1.0"
description = "Multi-agent social engineering swarm for the revel8 Agentic Social Engineer challenge (START Hack 2026)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "jsonschema>=4.22",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
